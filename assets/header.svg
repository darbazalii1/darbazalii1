<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2cb67d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2cb67d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .orb1 { animation: float1 7s ease-in-out infinite; }
      .orb2 { animation: float2 9s ease-in-out infinite; }
      .title { animation: rise 1.2s ease-out both; }
      .sub { animation: rise 1.2s ease-out 0.4s both; }
      .dot { animation: twinkle 3s ease-in-out infinite; }
      .d2 { animation-delay: 1s; } .d3 { animation-delay: 2s; }
      @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,18px); } }
      @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-14px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle class="orb1" cx="230" cy="70" r="190" fill="url(#glow1)"/>
  <circle class="orb2" cx="980" cy="200" r="210" fill="url(#glow2)"/>

  <g fill="#ffffff">
    <circle class="dot" cx="120" cy="40" r="2"/>
    <circle class="dot d2" cx="420" cy="30" r="1.6"/>
    <circle class="dot d3" cx="760" cy="48" r="2"/>
    <circle class="dot" cx="1080" cy="36" r="1.6"/>
    <circle class="dot d2" cx="1010" cy="110" r="1.4"/>
    <circle class="dot d3" cx="180" cy="170" r="1.4"/>
  </g>

  <path d="M0 215 C 200 180, 400 250, 600 220 S 1000 180, 1200 215 L1200 260 L0 260 Z" fill="#0d1117" opacity="0.55"/>
  <path d="M0 235 C 250 205, 450 265, 700 238 S 1050 210, 1200 238 L1200 260 L0 260 Z" fill="#0d1117"/>

  <g filter="url(#shadow)" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text class="title" x="600" y="118" font-size="66" font-weight="800" fill="url(#txt)" letter-spacing="1">Darbaz Ali</text>
    <text class="sub" x="600" y="164" font-size="22" font-weight="500" fill="#d6d3f0" letter-spacing="3">FLUTTER  •  NEXT.JS  •  FULL-STACK DEVELOPER</text>
  </g>
</svg>
